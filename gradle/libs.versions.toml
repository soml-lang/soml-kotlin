[versions]
kotlin = "2.4.21"
kotlinx-serialization = "1.12.0"
android-gradle = "9.3.1"

[libraries]
kotlinx-io = { module = "org.jetbrains.kotlinx:kotlinx-io-core", version = "0.9.2" }
soml-java = { module = "sh.soml:soml", version = "0.0.2" }
jackson-databind = { module = "tools.jackson.core:jackson-databind", version = "3.2.4" }
jackson-toml = { module = "tools.jackson.dataformat:jackson-dataformat-toml", version = "3.2.4" }
tomlj = { module = "org.tomlj:tomlj", version = "2.2.0" }
kotlinx-serialization-core = { module = "org.jetbrains.kotlinx:kotlinx-serialization-core", version.ref = "kotlinx-serialization" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "kotlinx-serialization" }
androidx-test-runner = { module = "androidx.test:runner", version = "1.7.0" }

[plugins]
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-multiplatform = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
android-multiplatform = { id = "com.android.kotlin.multiplatform.library", version.ref = "android-gradle" }
